name: Release Please

# 合并到 master 后自动评估是否发版（release-please-action@v4，manifest 模式）：
# - 自上个标签以来有 feat/fix/breaking 提交时，自动开 release PR
#   （按 Conventional Commits 升版本号 + 生成/更新 CHANGELOG.md）
# - 合并该 PR 时自动打 v* 标签并创建已发布 Release（正文即 changelog）
# - 标签随后触发 release.yml 构建各平台安装包并上传到该 Release
# 版本语义：fix→patch、feat→minor、breaking!→major（见 release-please-config.json）
on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          # GITHUB_TOKEN 创建的 PR 不会触发 CI 工作流；若日后 master 加了
          # 分支保护并要求检查通过，改用 PAT（secrets.RELEASE_PLEASE_TOKEN）
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Cargo.lock 包含多个同名 version 字段，release-please 的 TOML updater 无法只命中
      # 根包；让 Cargo 在机器人生成的 release 分支上按 Cargo.toml 自行同步，再提交回该 PR。
      - name: Resolve open release PR branch
        id: release-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --base "$GITHUB_REF_NAME" --json headRefName --jq '[.[] | select(.headRefName | startswith("release-please--branches--"))] | first | .headRefName // ""')"
          if [ -z "$branch" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Checkout release PR branch
        if: ${{ steps.release-pr.outputs.found == 'true' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release-pr.outputs.branch }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        if: ${{ steps.release-pr.outputs.found == 'true' }}

      - name: Sync Cargo.lock release version
        if: ${{ steps.release-pr.outputs.found == 'true' }}
        env:
          RELEASE_PR_BRANCH: ${{ steps.release-pr.outputs.branch }}
        run: |
          cargo metadata --manifest-path src-tauri/Cargo.toml --format-version 1 > /dev/null
          if git diff --quiet -- src-tauri/Cargo.lock; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src-tauri/Cargo.lock
          git commit -m "chore: sync Cargo.lock release version"
          git push origin "HEAD:${RELEASE_PR_BRANCH}"
