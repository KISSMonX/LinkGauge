name: Release

# 打 v* 标签时构建安装包并汇总到同一个 GitHub Release 草稿。
# 标签版本应与 src-tauri/tauri.conf.json 的 version 保持一致。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  bundle:
    name: Bundle (${{ matrix.os }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows 的打包目标已在 tauri.conf.json 中配置为 nsis
          - os: windows-latest
            args: ''
          - os: ubuntu-22.04
            args: '--bundles appimage,deb'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl wget file \
            libxdo-dev libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # tauri-action 会自行执行 tauri.conf.json 里的 beforeBuildCommand
      # （npm run build），这里只需装好依赖
      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: LinkGauge ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
