name: Release

# 打 v* 标签时构建各平台安装包，汇总到同一个 GitHub Release 草稿。
# 标签由 release-please 自动创建（见 release-please.yml），不要手动打标签；
# 合并 release PR 时它已生成草稿 Release，tauri-action 会找到它并上传产物。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  bundle:
    name: ${{ matrix.name }}
    permissions:
      contents: write
    strategy:
      # 某个平台失败不影响其余平台继续产出
      fail-fast: false
      matrix:
        include:
          # tauri.conf.json 里的 bundle.targets 固定为 nsis（面向本地 Windows 构建），
          # 因此每个平台都用 --bundles 显式覆盖成本平台的产物类型
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            args: --bundles nsis

          # Intel 包在 arm64 runner 上交叉编译：macos-13 的托管额度已被 GitHub 收紧，
          # 实测两次都分配不到 runner（一次排队超过一天），而 Apple 工具链本身
          # 支持在 arm64 上产出 x86_64，rust-toolchain 也已按 target 装好标准库。
          # 代价是 Intel 包无法在 CI 内自测，只能靠 Intel 机器人工验证。
          - name: macOS x64 (Intel)
            os: macos-14
            target: x86_64-apple-darwin
            args: --bundles dmg,app

          - name: macOS arm64 (Apple Silicon)
            os: macos-14
            target: aarch64-apple-darwin
            args: --bundles dmg,app

          # Linux 钉在 22.04：产物应在支持的最旧基础发行版上构建，避免抬高 glibc 门槛
          - name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: --bundles appimage,deb

          # ubuntu-*-arm 是 GitHub 托管的 arm64 runner，公开仓库免费；
          # 私有仓库需付费方案，否则改用自托管 runner
          - name: Linux arm64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            args: --bundles appimage,deb

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl wget file \
            libxdo-dev libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      # tauri-action 会自行执行 tauri.conf.json 里的 beforeBuildCommand
      # （npm run build），这里只需装好依赖
      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 应用内更新的 minisign 私钥：没有它 tauri 不会产出 .sig，latest.json 也就无法校验。
          # 公钥在 tauri.conf.json 的 plugins.updater.pubkey，两者必须成对。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: LinkGauge ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          # 各平台产物汇总进同一个 latest.json（updater 的清单）；后跑完的 job 会合并进已有文件
          includeUpdaterJson: true
          args: --target ${{ matrix.target }} ${{ matrix.args }}
