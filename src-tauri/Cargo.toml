[package]
name = "linkgauge"
version = "0.1.1"
description = "Cross-platform network performance desktop GUI (riperf3 engine)"
authors = ["LinkGauge contributors"]
edition = "2021"

[lib]
name = "linkgauge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "fs", "sync", "time", "macros"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
regex = "1"
hostname = "0.4"
local-ip-address = "0.6"
mac_address = "1"
# 纯 Rust 的 iperf3 协议实现（vendor 自 https://github.com/therealevanhenry/riperf3，
# 含本地 on_interval 补丁，详见 vendor/riperf3）
riperf3 = { path = "../vendor/riperf3" }
# 纯 Rust SSH 客户端（服务端页的远程控制台）。改用 ring 后端而非默认的 aws-lc-rs：
# ring 的 crates.io 包自带 Windows 预编译汇编，无需额外安装 NASM / CMake
russh = { version = "0.62", default-features = false, features = ["ring", "flate2", "rsa"] }

# 发布构建体积优化：剥离调试符号 + 链接时优化 + 单代码单元 + abort 恐慌
[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"
