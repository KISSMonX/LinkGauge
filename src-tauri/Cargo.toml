[package]
name = "iperf3-gui"
version = "0.1.0"
description = "Cross-platform iperf3 desktop GUI"
authors = ["iperf3 GUI contributors"]
edition = "2021"

[lib]
name = "iperf3_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "fs", "sync", "time", "macros"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
regex = "1"
hostname = "0.4"
local-ip-address = "0.6"
mac_address = "1"
